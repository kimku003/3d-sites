    <!-- Back to top button -->
    <button id="back-to-top" class="fixed bottom-8 right-8 w-12 h-12 rounded-full bg-indigo-600 hover:bg-indigo-700 flex items-center justify-center shadow-lg transition opacity-0 invisible">

    </button>

    <script defer src="projects-render.js?v=219ba9a"></script>
    <script>
        // Render all projects
        document.addEventListener('DOMContentLoaded', async () => {
            var grid = document.getElementById('projects-grid');
            if (grid) {
                await renderProjects(grid);
            }

            // Theme toggle with persistence
            const themeBtn = document.getElementById('toggle-theme');
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('theme-light');
            }

            const updateToggleLabels = () => {
                if (themeBtn) {
                    const isLight = document.body.classList.contains('theme-light');
                    themeBtn.innerHTML = `<i class="fas fa-adjust mr-1"></i> Thème: ${isLight ? 'Clair' : 'Sombre'}`;
                }
            };

            updateToggleLabels();

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    document.body.classList.toggle('theme-light');
                    const isLight = document.body.classList.contains('theme-light');
                    localStorage.setItem('theme', isLight ? 'light' : 'dark');
                    updateToggleLabels();
                });
            }
        });

        // Back to top button
        const backToTopButton = document.getElementById('back-to-top');

        window.addEventListener('scroll', () => {
            if (window.pageYOffset > 300) {
                backToTopButton.classList.remove('opacity-0', 'invisible');
                backToTopButton.classList.add('opacity-100', 'visible');
            } else {
                backToTopButton.classList.remove('opacity-100', 'visible');
                backToTopButton.classList.add('opacity-0', 'invisible');
            }
        });

        backToTopButton.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
